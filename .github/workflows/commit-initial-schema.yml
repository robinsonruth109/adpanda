name: Commit reviewed-initial-schema candidate
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commit-initial-schema.yml'
permissions:
  contents: write
jobs:
  prepare-initial-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/platform-foundation
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Generate initial SQL only if missing
        run: |
          test ! -e prisma/migrations/20261022_initial/migration.sql
          mkdir -p prisma/migrations/20261022_initial
          echo 'provider = "mysql"' > prisma/migrations/migration_lock.toml
          DATABASE_URL='mysql://preview:unused@localhost:3306/adpanda' npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > prisma/migrations/20261022_initial/migration.sql
          test -s prisma/migrations/20261022_initial/migration.sql
          grep -q 'CREATE TABLE' prisma/migrations/20261022_initial/migration.sql
      - name: Commit migration candidate — do not apply
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/migrations
          git commit -m 'db: add initial Prisma MySQL migration for review'
          git push origin HEAD:feature/platform-foundation

# Does not connect to production MySQL and does not run migrate deploy.
